{% extends "base.html" %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="ids-card p-5" style="width: 100%; max-width: 480px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.08); background: rgba(22,27,34, 0.9);">
        <div class="text-center mb-5">
            <div class="bg-primary d-inline-block p-3 rounded-4 mb-3 shadow">
                <i class="fa-solid fa-user-plus text-white fs-3"></i>
            </div>
            <h3 class="fw-bold text-white mb-2">Новый Админ Кластер</h3>
            <p class="text-muted small text-uppercase fw-bold opacity-75" style="letter-spacing: 2px;">Data Management Enrollment Layer</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-4">
                <label class="ids-tiny-label d-block mb-2 opacity-75 text-info">NEW CLUSTER ALIAS (НИКНЕЙМ)</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary fw-bold px-3 py-2" placeholder="Admin_Orion_92" required autofocus>
            </div>
            <div class="mb-4">
                <label class="ids-tiny-label d-block mb-2 opacity-75 text-info">COMMUNICATION BACKBONE (EMAIL)</label>
                <input type="email" name="email" class="form-control bg-dark text-white border-secondary fw-bold px-3 py-2" placeholder="new.root@corporate.loc" required>
            </div>
            <div class="mb-5">
                <label class="ids-tiny-label d-block mb-2 opacity-75 text-warning">SYMMETRIC SECURE PASSPHRASE</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary fw-bold px-3 py-2" placeholder="Strict Cryptography Pattern Here..." required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bolder mb-4 shadow" style="font-size: 13px; letter-spacing: 1px; border-radius: 12px; background:#f85149; border:none">
                <i class="fa-solid fa-triangle-exclamation me-1 opacity-50"></i> REQUEST ZERO-TRUST ACTIVATION LAYER
            </button>

            <div class="text-center pt-2">
                <a href="{{ url_for('login') }}" class="text-muted fw-bold text-decoration-none" style="font-size: 12px;">
                   Система опознала. Вернуться в сеанс Аутентификации (ВХОД).
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
